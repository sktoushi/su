    // Uniform crypto-random integer in [0, maxExclusive)
    function cryptoRandInt(maxExclusive) {
      if (!Number.isInteger(maxExclusive) || maxExclusive <= 0) {
        throw new Error("maxExclusive must be a positive integer");
      }
      const range = 0x100000000; // 2^32
      const limit = range - (range % maxExclusive);

      const buf = new Uint32Array(1);
      while (true) {
        crypto.getRandomValues(buf);
        const x = buf[0];
        if (x < limit) return x % maxExclusive;
      }
    }

    function pick() {
      const chosen = targets[cryptoRandInt(targets.length)];
      document.getElementById("picked").textContent = `${chosen.repo} #${chosen.id}`;
      const a = document.getElementById("link");
      a.href = chosen.url;
      a.textContent = chosen.url;
      return chosen.url;
    }

    const first = pick();
    setTimeout(() => window.location.replace(first), 200);

      const next = pick();
      window.location.replace(next);
