<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deja Vu Version Randomizer</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{height:100%;margin:0;font-family:system-ui;background:#0b0c10;color:#c5c6c7;display:grid;place-items:center}
.card{max-width:700px;padding:1rem 1.5rem;border:1px solid #1f2833;border-radius:12px;background:#0f1115}
</style>
</head>
<body>
<div class="card">
<h2>Redirecting…</h2>
<p>If redirect fails, wait a moment.</p>
</div>
<script>
(function(){
"use strict";

var DEFAULT_MAX = 20;
var HARD_MAX = 0x100000000;

var LS_KEY = "dejavu_randomizer_v100";
var SS_KEY = "dejavu_session_v100";

var SESSION_TIMEOUT_MS = 2*60*60*1000;
var SESSION_SOFT_RESET_MS = 15*60*1000;

function cryptoRand32(){
  var a=new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0];
}

function randomFloat(){
  return cryptoRand32()/4294967296;
}

function weightedPick(items){
  var total=0;
  for(var i=0;i<items.length;i++) total+=items[i].weight;
  if(total<=0) return items[Math.floor(randomFloat()*items.length)].value;

  var r=randomFloat()*total;
  var c=0;
  for(var j=0;j<items.length;j++){
    c+=items[j].weight;
    if(r<c) return items[j].value;
  }
  return items[items.length-1].value;
}

function parseMax(){
  try{
    var p=new URLSearchParams(location.search);
    var raw=p.get("max");
    if(raw===null||raw==="") return DEFAULT_MAX;
    var n=Math.floor(Number(raw));
    if(!Number.isFinite(n)||n<1) return DEFAULT_MAX;
    return Math.min(n,HARD_MAX);
  }catch(e){
    return DEFAULT_MAX;
  }
}

function loadJSON(storage,key,fallback){
  try{
    var v=storage.getItem(key);
    if(!v) return fallback;
    return JSON.parse(v);
  }catch(e){
    return fallback;
  }
}

function saveJSON(storage,key,obj){
  try{
    storage.setItem(key,JSON.stringify(obj));
  }catch(e){}
}

var now=Date.now();
var max=Math.max(DEFAULT_MAX,parseMax());

var longMem=loadJSON(localStorage,LS_KEY,{
  transitions:{},
  regionAffinity:{},
  totalPicks:0
});

var session=loadJSON(sessionStorage,SS_KEY,null);

if(!session || !session.lastSeen || (now-session.lastSeen)>SESSION_TIMEOUT_MS){
  session={
    sessionStart:now,
    lastSeen:now,
    current:null,
    recent:[],
    eraCenter:1+Math.floor(randomFloat()*max),
    eraExpiry:now+(20*60*1000)
  };
}

if((now-session.lastSeen)>SESSION_SOFT_RESET_MS){
  session.eraCenter=1+Math.floor(randomFloat()*max);
  session.eraExpiry=now+(20*60*1000);
}

session.lastSeen=now;

if(now>session.eraExpiry){
  session.eraCenter=1+Math.floor(randomFloat()*max);
  session.eraExpiry=now+(20*60*1000);
}

var sessionMinutes=(now-session.sessionStart)/60000;

var novelty=0.7,eraW=0.2,echoW=0.05,replayW=0.03,walkW=0.02;

if(sessionMinutes>10){
  novelty=0.4; eraW=0.3; echoW=0.2; replayW=0.1; walkW=0.1;
}
if(sessionMinutes>30){
  novelty=0.2; eraW=0.4; echoW=0.25; replayW=0.15; walkW=0.15;
}
if(sessionMinutes>90){
  novelty=0.1; eraW=0.25; echoW=0.35; replayW=0.3; walkW=0.2;
}

if(randomFloat()<0.02){
  var pure=1+Math.floor(randomFloat()*max);
  redirect(pure);
  return;
}

var candidates=[];

for(var v=1;v<=max;v++){
  var score=1;

  score += novelty;

  var distEra=Math.abs(v-session.eraCenter);
  score += eraW * (max/(distEra+1));

  var recent=session.recent||[];
  for(var r=0;r<recent.length;r++){
    var d=Math.abs(v-recent[r]);
    score += echoW*(1/(d+1));
  }

  if(session.current!==null){
    var wd=Math.abs(v-session.current);
    score += walkW*(1/(wd+1))*5;
  }

  if(session.current!==null){
    var key=session.current+"->"+v;
    if(longMem.transitions[key]){
      score += replayW*Math.log(1+longMem.transitions[key]);
    }
  }

  if(longMem.regionAffinity[v]){
    score += Math.log(1+longMem.regionAffinity[v])*0.15;
  }

  candidates.push({value:v,weight:score});
}

var chosen=weightedPick(candidates);

function redirect(versionNumber){

  if(session.current!==null){
    var tk=session.current+"->"+versionNumber;
    longMem.transitions[tk]=(longMem.transitions[tk]||0)+1;
  }

  longMem.regionAffinity[versionNumber]=(longMem.regionAffinity[versionNumber]||0)+1;
  longMem.totalPicks++;

  session.current=versionNumber;
  session.recent.push(versionNumber);

  while(session.recent.length>30){
    session.recent.shift();
  }

  saveJSON(localStorage,LS_KEY,longMem);
  saveJSON(sessionStorage,SS_KEY,session);

  var target="https://sktoushi.github.io/su/skyway-scheduler"+String(versionNumber)+".html";
  window.location.replace(target);
}

redirect(chosen);

})();
</script>
</body>
</html>
