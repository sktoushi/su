<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deja Vu Version Randomizer</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{height:100%;margin:0;font-family:system-ui;background:#0b0c10;color:#c5c6c7;display:grid;place-items:center}
.card{max-width:700px;padding:1rem 1.5rem;border:1px solid #1f2833;border-radius:12px;background:#0f1115}
</style>
</head>
<body>
<div class="card">
<h2>Redirecting…</h2>
<p>If redirect fails, wait a moment.</p>
</div>
<script>
(function(){
"use strict";

// Configuration constants
const DEFAULT_MAX = 12;
const HARD_MAX = 0x100000000;
const LS_KEY = "dejavu_randomizer_v1";
const SS_KEY = "dejavu_session_v1";
const SESSION_TIMEOUT_MS = 7200000; // 2 hours
const SESSION_SOFT_RESET_MS = 900000; // 15 minutes
const ERA_DURATION_MS = 1200000; // 20 minutes
const RECENT_HISTORY_LIMIT = 30;
const PURE_RANDOM_CHANCE = 0.02;

// Crypto-secure random number generation
const cryptoRand32 = () => crypto.getRandomValues(new Uint32Array(1))[0];
const randomFloat = () => cryptoRand32() / 4294967296;

// Weighted random selection
function weightedPick(items){
  const total = items.reduce((sum, item) => sum + item.weight, 0);
  if(total <= 0) return items[Math.floor(randomFloat() * items.length)].value;
  
  let r = randomFloat() * total;
  for(const item of items){
    r -= item.weight;
    if(r < 0) return item.value;
  }
  return items[items.length - 1].value;
}

// Parse max parameter from URL
function parseMax(){
  try{
    const raw = new URLSearchParams(location.search).get("max");
    if(!raw) return DEFAULT_MAX;
    const n = Math.floor(Number(raw));
    return (Number.isFinite(n) && n >= 1) ? Math.min(n, HARD_MAX) : DEFAULT_MAX;
  }catch(e){
    return DEFAULT_MAX;
  }
}

// Storage helpers
const loadJSON = (storage, key, fallback) => {
  try{
    const v = storage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){
    return fallback;
  }
};

const saveJSON = (storage, key, obj) => {
  try{
    storage.setItem(key, JSON.stringify(obj));
  }catch(e){}
};

// Initialize state
const now = Date.now();
const max = Math.max(DEFAULT_MAX, parseMax());

const longMem = loadJSON(localStorage, LS_KEY, {
  transitions: {},
  regionAffinity: {},
  totalPicks: 0
});

let session = loadJSON(sessionStorage, SS_KEY, null);

// Session initialization/reset logic
if(!session || !session.lastSeen || (now - session.lastSeen) > SESSION_TIMEOUT_MS){
  session = {
    sessionStart: now,
    lastSeen: now,
    current: null,
    recent: [],
    eraCenter: 1 + Math.floor(randomFloat() * max),
    eraExpiry: now + ERA_DURATION_MS
  };
}

if((now - session.lastSeen) > SESSION_SOFT_RESET_MS){
  session.eraCenter = 1 + Math.floor(randomFloat() * max);
  session.eraExpiry = now + ERA_DURATION_MS;
}

session.lastSeen = now;

if(now > session.eraExpiry){
  session.eraCenter = 1 + Math.floor(randomFloat() * max);
  session.eraExpiry = now + ERA_DURATION_MS;
}

// Calculate adaptive weights based on session duration
const sessionMinutes = (now - session.sessionStart) / 60000;
let novelty = 0.7, eraW = 0.2, echoW = 0.05, replayW = 0.03, walkW = 0.02;

if(sessionMinutes > 90){
  novelty = 0.1; eraW = 0.25; echoW = 0.35; replayW = 0.3; walkW = 0.2;
}else if(sessionMinutes > 30){
  novelty = 0.2; eraW = 0.4; echoW = 0.25; replayW = 0.15; walkW = 0.15;
}else if(sessionMinutes > 10){
  novelty = 0.4; eraW = 0.3; echoW = 0.2; replayW = 0.1; walkW = 0.1;
}

// Pure random escape hatch (2% chance)
if(randomFloat() < PURE_RANDOM_CHANCE){
  redirect(1 + Math.floor(randomFloat() * max));
  return;
}

// Build weighted candidates
const candidates = [];
const recent = session.recent || [];

for(let v = 1; v <= max; v++){
  let score = 1 + novelty;
  
  // Era proximity bonus
  const distEra = Math.abs(v - session.eraCenter);
  score += eraW * (max / (distEra + 1));
  
  // Echo effect from recent history
  for(const r of recent){
    const d = Math.abs(v - r);
    score += echoW * (1 / (d + 1));
  }
  
  // Random walk bonus
  if(session.current !== null){
    const wd = Math.abs(v - session.current);
    score += walkW * (1 / (wd + 1)) * 5;
    
    // Replay bonus from transition history
    const key = session.current + "->" + v;
    if(longMem.transitions[key]){
      score += replayW * Math.log(1 + longMem.transitions[key]);
    }
  }
  
  // Regional affinity bonus
  if(longMem.regionAffinity[v]){
    score += Math.log(1 + longMem.regionAffinity[v]) * 0.15;
  }
  
  candidates.push({value: v, weight: score});
}

// Select and redirect
const chosen = weightedPick(candidates);

function redirect(versionNumber){
  // Update transition history
  if(session.current !== null){
    const tk = session.current + "->" + versionNumber;
    longMem.transitions[tk] = (longMem.transitions[tk] || 0) + 1;
  }
  
  // Update regional affinity
  longMem.regionAffinity[versionNumber] = (longMem.regionAffinity[versionNumber] || 0) + 1;
  longMem.totalPicks++;
  
  // Update session state
  session.current = versionNumber;
  session.recent.push(versionNumber);
  
  // Trim recent history
  if(session.recent.length > RECENT_HISTORY_LIMIT){
    session.recent = session.recent.slice(-RECENT_HISTORY_LIMIT);
  }
  
  // Persist state
  saveJSON(localStorage, LS_KEY, longMem);
  saveJSON(sessionStorage, SS_KEY, session);
  
  // Navigate
  window.location.replace("https://sktoushi.github.io/su/allv" + versionNumber + ".html");
}

redirect(chosen);

})();
</script>
</body>
</html>
