            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 600px;
        }
        .error {
            background: rgba(255, 59, 48, 0.2);
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1rem;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #fff;
            text-decoration: underline;
        }
    </style>

        function redirect() {
            try {
                // Parse URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const user = urlParams.get('user');
                const repository = urlParams.get('repository');

                // Validate required parameters
                if (!user || !repository) {
                    throw new Error('Missing required parameters. Please provide both "user" and "repository" in the URL.');
                }

                // Select a random suffix
                const randomIndex = Math.floor(Math.random() * suffixes.length);
                const randomSuffix = suffixes[randomIndex];

                // Construct the GitHub URL with exact format
                const githubUrl = `https://github.com/${user}/${repository}/blob/in/Screenshot%202026-06-16%20${randomSuffix}.png`;

                // Update message
                document.getElementById('message').innerHTML = `Redirecting to:<br><a href="${githubUrl}">${githubUrl}</a>`;

                // Redirect after a short delay to allow user to see the URL
                setTimeout(() => {
                    window.location.href = githubUrl;
                }, 500);

            } catch (error) {
                // Display error message
                document.querySelector('.container').innerHTML = `
                    <h1>❌ Error</h1>
                    <div class="error">
                        <p><strong>${error.message}</strong></p>
                        <p>Usage: <code>index.html?user=USERNAME&repository=REPO_NAME</code></p>
                        <p>Example: <code>index.html?user=octocat&repository=Hello-World</code></p>

        }
