<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>IVOS26 Randomizer</title>
      <script src="common/failover-cache.js"></script>
      <script src="common/skyway-scheduler-utils.js"></script>
      <script src="common/config-loader.js"></script>
      <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
      <meta http-equiv="Pragma" content="no-cache">
      <meta http-equiv="Expires" content="0">
      <script>
         const urls = [
             "https://youtu.be/Unzc731iCUY?si=ED5C7n46KB019Oyd"
         ];
         
         function secureRandomIndex(max) {
             const array = new Uint32Array(1);
             crypto.getRandomValues(array);
             return array[0] % max;
         }
         
         function generateTargetURL() {
             return urls[secureRandomIndex(urls.length)];
         }
         
         FailoverCache.redirect('skyway-scheduler51', generateTargetURL, {
             cacheSize: 2,
             maxTotalCached: 30,
             resetThreshold: 50
         });
      </script>
   </head>
   <body>
      <p>Redirecting...</p>
   </body>
</html>
