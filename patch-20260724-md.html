const DB_NAME = "DriveFileCachePatch20260710";
const STORE = "cachePatch20260710";

const bar = document.getElementById("bar");
const status = document.getElementById("status");

function gauge(percent, text){
    bar.value = percent;
    status.textContent = text;
}

function openDB(){
    return new Promise((resolve,reject)=>{
        gauge(10,"Opening database...");

        const req = indexedDB.open(DB_NAME,1);

        req.onupgradeneeded = e=>{
            const db=e.target.result;
            if(!db.objectStoreNames.contains(STORE)){
                db.createObjectStore(STORE);
            }
        };

        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
    });
}

function get(db,key){
    return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,"readonly");
        const req=tx.objectStore(STORE).get(key);
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
    });
}

function put(db,key,val){
    return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,"readwrite");
        const req=tx.objectStore(STORE).put(val,key);
        req.onsuccess=()=>resolve();
        req.onerror=()=>reject(req.error);
    });
}

function redirect(ids){
    gauge(100,"Redirecting...");
    const id=ids[Math.floor(Math.random()*ids.length)];
    location.replace(PREFIX + id + SUFFIX);
}

(async()=>{

    const db=await openDB();

    gauge(25,"Checking cache...");

    const version=await get(db,"version");

    if(version===CACHE_VERSION){

        gauge(50,"Loading cached IDs...");

        const ids=await get(db,"ids");

        if(ids){

            gauge(90,"Choosing random file...");
            redirect(ids);
            return;
        }
    }

    gauge(60,"Building cache (first run only)...");

    await put(db,"ids",FILE_IDS);

    gauge(85,"Saving cache...");

    await put(db,"version",CACHE_VERSION);

    redirect(FILE_IDS);

})();
