<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Repository Issue Randomizer (with Noise Patch + Session Decay)</title>
  <script src="common/random-utils.js"></script>
  <script src="common/config-loader.js"></script>
  <script src="common/stash-excess-detector.js"></script>
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fafafa;
      margin: 2rem;
    }
    code {
      background: #eee;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<script>
/* ============================================================
   BASE IMPLEMENTATION — preserved exactly as the guiding logic
   ============================================================ */
(async () => {
  // Check for stash excess on page load
  StashExcessDetector.checkAndAlert().catch(e => console.error('Stash check failed:', e));

  try {
    const cfg = await ConfigLoader.load('all');
    const repos = cfg.repositories2x || {};
    const issues = [];
    const issueToRepo = []; // Track which repo each issue belongs to

    // Gather all issue URLs and track repository mapping
    for (const [repo, info] of Object.entries(repos)) {
      const start = Number(info.issueStartNumber);
      const end = Number(info.issueEndNumber);
      const user = info.username;
      for (let i = start; i <= end; i++) {
        issues.push(`https://github.com/${user}/${repo}/issues/${i}`);
        issueToRepo.push(repo); // Track which repo this issue belongs to
      }
    }

    const n = issues.length;
    const formulas = Array.isArray(cfg.formulas) ? cfg.formulas : [];
    const formulaParam = formulas.length > 0
      ? formulas[Math.floor(getSecureRandomNumber() * formulas.length)]
      : 'random';

    // Apply formula-based weights
    const weights = new Array(n).fill(1);
    if (formulaParam === 'leftLeaning') {
      for (let i = 0; i < n; i++) {
        weights[i] = (n - i) * (0.5 + getSecureRandomNumber());
      }
    } else if (formulaParam === 'rightLeaning1') {
      for (let i = 0; i < n; i++) {
        weights[i] = (i + 1) * (0.5 + getSecureRandomNumber());
      }
    } else if (formulaParam === 'recent20Percent') {
      const startIdx = Math.floor(n * 0.8);
      weights.fill(5, startIdx);
    } else if (formulaParam === 'recent5Percent') {
      const startIdx = Math.floor(n * 0.95);
      weights.fill(20, startIdx);
    }

    // Apply probability booster (multiplies weight, doesn't change issue range)
    for (let i = 0; i < n; i++) {
      const repoName = issueToRepo[i];
      const booster = Number(repos[repoName]?.probabilityBooster) || 1;
      weights[i] *= booster;
    }

    /* ============================================================
       NOISE PATCH — adaptive volatility + erratic randomness + session decay
       ============================================================ */
    function noisePatch(weights, issues) {
      // Secure RNG utilities
      const cryptoRandom = () => {
        const buf = new Uint32Array(1);
        window.crypto.getRandomValues(buf);
        return buf[0] / 0xffffffff;
      };

      const cryptoNormal = (mean = 0, stdDev = 1) => {
        let u1 = 0, u2 = 0;
        while (u1 === 0) u1 = cryptoRandom();
        while (u2 === 0) u2 = cryptoRandom();
        const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
        return z0 * stdDev + mean;
      };

      // Retrieve memory from localStorage
      const STORAGE_KEY = "repo_randomizer_memory_v2x";
      const MS_PER_DAY = 86400000;
      const DECAY_RATE = 0.15;
      const BIAS_FACTOR = 0.05;
      const ERRATIC_PROBABILITY = 0.08;
      
      let mem = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      let history = mem.history || new Array(weights.length).fill(0);
      const lastTs = mem.lastTs || Date.now();
      const now = Date.now();

      // Apply exponential decay based on time elapsed
      const daysPassed = Math.max(0, (now - lastTs) / MS_PER_DAY);
      if (daysPassed > 0.1) {
        const decayFactor = Math.exp(-DECAY_RATE * daysPassed);
        history = history.map(v => v * decayFactor);
      }

      // Calculate adaptive bias to favor under-visited items
      const total = history.reduce((a, b) => a + b, 0);
      const bias = new Array(weights.length).fill(0);
      if (total > 0) {
        const avg = total / history.length;
        for (let i = 0; i < history.length; i++) {
          bias[i] = (avg - history[i]) / avg * BIAS_FACTOR;
        }
      }

      // Determine erratic mode (higher volatility)
      const erratic = cryptoRandom() < ERRATIC_PROBABILITY;
      const stdDev = erratic ? 0.35 : 0.08;

      // Apply noise and bias to weights
      const adjusted = weights.map((w, i) => {
        const noise = cryptoNormal(0, stdDev) * w;
        const drift = bias[i];
        return Math.max(0.0001, w + w * noise + w * drift);
      });

      // Normalize to probability distribution
      const sum = adjusted.reduce((a, b) => a + b, 0);
      const normalized = adjusted.map(w => w / sum);

      // Sample from distribution
      const r = cryptoRandom();
      let cumulative = 0;
      let chosenIdx = normalized.length - 1;
      for (let i = 0; i < normalized.length; i++) {
        cumulative += normalized[i];
        if (r < cumulative) {
          chosenIdx = i;
          break;
        }
      }

      // Update memory
      history[chosenIdx] = (history[chosenIdx] || 0) + 1;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        history,
        lastTs: now
      }));

      return { index: chosenIdx, erratic, adjusted: normalized, daysPassed };
    }

    // Execute noise patch and redirect
    const noisy = noisePatch(weights, issues);
    const chosen = issues[noisy.index];
    location.href = chosen;

    // Fallback diagnostic display
    document.addEventListener('DOMContentLoaded', () => {
      const pre = document.createElement('pre');
      pre.textContent =
        `Selected: ${chosen}\n` +
        `Erratic mode: ${noisy.erratic ? "⚡ yes" : "⤵ stable"}\n` +
        `Days since last session: ${noisy.daysPassed.toFixed(2)}\n` +
        `Weights (top 5): ${noisy.adjusted.slice(0,5).map(w => w.toFixed(4)).join(', ')}`;
      document.body.appendChild(pre);
    });

  } catch (e) {
    document.body.textContent = e.message;
  }
})();
</script>

</body>
</html>
