<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Redirecting...</title>

  <script>
    (() => {
      "use strict";

      const targets = [
        "https://ryspare25.github.io/ref2510/view-now.html?fileName=pmbok2025.pdf",
        "https://ryspare25.github.io/ref2510/viewer-pdfjs-4chan2.html?fileName=pmi-acp-first-try.pdf"
      ];

      const STORAGE_KEY = "pdf_randomizer_last_target";

      function secureRandom(max) {
        if (max <= 1) return 0;

        const values = new Uint32Array(1);
        const range = 0x100000000;
        const limit = range - (range % max);

        let value;
        do {
          crypto.getRandomValues(values);
          value = values[0];
        } while (value >= limit);

        return value % max;
      }

      function selectTarget() {
        if (targets.length === 0) {
          throw new Error("No redirect targets configured");
        }

        if (targets.length === 1) {
          return targets[0];
        }

        let previous = null;

        try {
          previous = localStorage.getItem(STORAGE_KEY);
        } catch (error) {
          console.warn("Storage unavailable:", error);
        }

        // Exclude the previously selected URL.
        const candidates = targets.filter(
          target => target !== previous
        );

        const pool = candidates.length
          ? candidates
          : targets;

        const selected = pool[secureRandom(pool.length)];

        try {
          localStorage.setItem(STORAGE_KEY, selected);
        } catch (error) {
          console.warn("Could not save selection:", error);
        }

        return selected;
      }

      try {
        const selectedTarget = selectTarget();

        console.log("Redirecting to:", selectedTarget);

        window.location.replace(selectedTarget);
      } catch (error) {
        console.error("Redirect failed:", error);
        document.addEventListener("DOMContentLoaded", () => {
          document.body.textContent =
            "Redirect failed. Please reload.";
        });
      }
    })();
  </script>
</head>

<body>
  <p>Redirecting...</p>

  <noscript>
    <p>JavaScript is required for automatic redirection.</p>
    <a href="https://ryspare25.github.io/ref2510/view-now.html?fileName=pmbok2025.pdf">
      Open PMBOK 2025 PDF
    </a>
  </noscript>
</body>
</html>
