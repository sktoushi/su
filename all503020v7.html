
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <script>
    const targets = [
      "https://ryspare25.github.io/ref2510/view-now.html?fileName=pmbok2025.pdf",
      "https://ryspare25.github.io/ref2510/viewer-pdfjs-4chan2.html?fileName=pmi-acp-first-try.pdf"
    ];

    // Randomly select a redirection target
    const selectedTarget =
      targets[Math.floor(Math.random() * targets.length)];

    // Immediately redirect
    window.location.replace(selectedTarget);
  </script>
</head>
<body>
  <p>Redirecting...</p>
  <noscript>
    <p>
      <a href="https://ryspare25.github.io/ref2510/view-now.html?fileName=pmbok2025.pdf">
        Open PMBOK 2025 PDF
      </a>
    </p>
  </noscript>
</body>
</html>
