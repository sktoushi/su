<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Image Repository Redirect</title>

  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    code {
      background: #eee;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Selecting repository...</h3>
  </div>

  <script>
    (async () => {
  // Check for stash excess on page load
  StashExcessDetector.checkAndAlert().catch(e => console.error('Stash check failed:', e));

      try {
        const res = await fetch(
          'config/all.json?t=' + Date.now(),
          { cache: 'no-store' }
        );

        if (!res.ok) {
          throw new Error(
            `Failed to load config/all.json (${res.status})`
          );
        }

        const cfg = await res.json();
        const repos = cfg.repositories2x || {};

        const imageRepos = Object.entries(repos)
          .filter(([_, info]) => info && info.images === true)
          .map(([repoName]) => repoName);

        if (imageRepos.length === 0) {
          throw new Error(
            'No repositories2x found with images:true'
          );
        }

        // Cryptographically secure random selection
        const randomValue =
          crypto.getRandomValues(new Uint32Array(1))[0];

        const index =
          randomValue % imageRepos.length;

        const selectedRepo =
          imageRepos[index];

        const targetUrl =
          `https://sktoushi.github.io/su/${selectedRepo}-images.html`;

        console.log('Available repos:', imageRepos);
        console.log('Selected repo:', selectedRepo);
        console.log('Redirecting to:', targetUrl);

        // Immediate redirect
        window.location.replace(targetUrl);

        // Fallback display if redirect somehow fails
        setTimeout(() => {
          document.body.innerHTML = `
            <div class="container">
              <h3>Redirecting...</h3>
              <p>Selected repository:</p>
              <p><code>${selectedRepo}</code></p>
              <p>
                <a href="${targetUrl}">
                  Continue manually
                </a>
              </p>
            </div>
          `;
        }, 1000);

      } catch (e) {
        console.error(e);

        document.body.innerHTML = `
          <div class="container">
            <h3>Error</h3>
            <p>${e.message}</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
