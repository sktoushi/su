<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Issue Picker</title>
  <meta http-equiv="Cache-Control" content="no-store" />
</head>
<body>
<script>
(async () => {
  try {
    const res = await fetch('config/all.json');
    if (!res.ok) throw new Error('Failed to load config');
    const cfg = await res.json();
    const repos = cfg.repositories || {};

    /* ── Crypto RNG ── */
    function cr() {
      const b = new Uint32Array(1);
      crypto.getRandomValues(b);
      return b[0] / 0xffffffff;
    }
    function crNormal(mean = 0, sd = 1) {
      let u1 = 0, u2 = 0;
      while (!u1) u1 = cr();
      while (!u2) u2 = cr();
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2) * sd + mean;
    }

    /* ── Repo quality weights (star repos boosted; images repos down-weighted) ── */
    const QUALITY = {
      "five-star-knowledge":  5.0,
      "four-star-knowledge":  4.0,
      "three-star-knowledge": 3.0,
      "two-star-knowledge":   2.0,
      "one-star-knowledge":   1.5,
      "log":                  1.3,
      "the-snackbar":         1.2,
      "redirect0915":         1.1,
      "img":                  0.4,
    };
    function repoQuality(name, info) {
      if (info.images === true) return 0.5;
      return QUALITY[name] ?? 1.0;
    }

    /* ── Build flat chronological issue list ── */
    const issues = [];
    for (const [repo, info] of Object.entries(repos)) {
      for (let i = Number(info.issueStartNumber); i <= Number(info.issueEndNumber); i++) {
        issues.push({
          url: `https://github.com/${info.username}/${repo}/issues/${i}`,
          repo,
          quality: repoQuality(repo, info)
        });
      }
    }
    const n = issues.length;

    /* ── Formula bias from cfg.formulas (same pick logic as original) ── */
    const FORMULA_MAP = {
      random:          'balanced',
      leftLeaning:     'leftLeaning',
      rightLeaning1:   'rightLeaning',
      recent20Percent: 'recent20',
      recent5Percent:  'recent5',
    };
    const formulas = Array.isArray(cfg.formulas) ? cfg.formulas : [];
    const rawFormula = formulas.length ? formulas[Math.floor(cr() * formulas.length)] : 'random';
    const mode = FORMULA_MAP[rawFormula] ?? 'balanced';

    /* ── localStorage memory ── */
    const MEM_KEY = "picker_novelty_v3";
    let mem;
    try {
      const raw = localStorage.getItem(MEM_KEY);
      mem = raw ? JSON.parse(raw) : null;
      if (!mem || !mem.visits || mem.visits.length !== n) {
        mem = { visits: new Array(n).fill(0), lastTs: Date.now(), clusterSeed: -1, clusterAge: 0 };
      }
    } catch { mem = { visits: new Array(n).fill(0), lastTs: Date.now(), clusterSeed: -1, clusterAge: 0 }; }

    /* ── Session decay on visit counts ── */
    const daysPassed = Math.max(0, (Date.now() - mem.lastTs) / 86400000);
    if (daysPassed > 0.05) {
      const decay = Math.exp(-0.23 * daysPassed);
      mem.visits = mem.visits.map(v => v * decay);
    }

    /* ── Cluster-of-novelty weight computation ── */

    // 1. Novelty score: favor under-visited indices
    const totalVisits = mem.visits.reduce((a, b) => a + b, 0);
    const avgV = totalVisits > 0 ? totalVisits / n : 1;
    const novelty = mem.visits.map(v => Math.max(0, 1 - (v / avgV) * 0.7));

    // 2. Cluster Gaussian window around last cluster seed
    const clusterSigma = 120;
    const center = mem.clusterSeed >= 0 ? mem.clusterSeed : Math.floor(n / 2);
    const clusterStrength = Math.max(0, 1 - (mem.clusterAge || 0) / 18);
    const clusterW = issues.map((_, i) => {
      const d = i - center;
      return Math.exp(-(d * d) / (2 * clusterSigma * clusterSigma));
    });

    // 3. Formula bias
    const formulaW = new Array(n).fill(1);
    if (mode === 'leftLeaning') {
      for (let i = 0; i < n; i++) formulaW[i] = (n - i) / n;
    } else if (mode === 'rightLeaning') {
      for (let i = 0; i < n; i++) formulaW[i] = (i + 1) / n;
    } else if (mode === 'recent20') {
      for (let i = Math.floor(n * 0.8); i < n; i++) formulaW[i] = 4;
    } else if (mode === 'recent5') {
      for (let i = Math.floor(n * 0.95); i < n; i++) formulaW[i] = 12;
    }

    // 4. Erratic noise
    const erratic = cr() < 0.08;
    const noiseSd = erratic ? 0.4 : 0.07;

    // 5. Blend: novelty vs cluster based on cluster strength
    const nb = mem.clusterSeed < 0 ? 0.6 : Math.max(0.2, 1 - clusterStrength * 0.7);
    const cb = 1 - nb;

    let weights = issues.map((iss, i) => {
      const base = iss.quality * formulaW[i];
      const noise = Math.max(0, 1 + crNormal(0, noiseSd));
      return Math.max(0.00001, base * (nb * novelty[i] * 2 + cb * clusterW[i] * 3) * noise);
    });

    // 6. Normalize
    const sum = weights.reduce((a, b) => a + b, 0);
    weights = weights.map(w => w / sum);

    // 7. Sample
    const r = cr();
    let cumulative = 0;
    let chosenIdx = n - 1;
    for (let i = 0; i < n; i++) {
      cumulative += weights[i];
      if (r < cumulative) { chosenIdx = i; break; }
    }

    /* ── Determine pick mode and update cluster ── */
    const clusterDom = clusterW[chosenIdx] > novelty[chosenIdx] && clusterStrength > 0.3;
    const pickMode = erratic ? 'erratic' : (clusterDom ? 'cluster' : 'novel');

    if (pickMode === 'novel' || mem.clusterSeed < 0) {
      mem.clusterSeed = chosenIdx;
      mem.clusterAge = 0;
    } else {
      mem.clusterSeed = Math.round(mem.clusterSeed * 0.85 + chosenIdx * 0.15);
      mem.clusterAge = (mem.clusterAge || 0) + 1;
    }

    mem.visits[chosenIdx] = (mem.visits[chosenIdx] || 0) + 1;
    mem.lastTs = Date.now();

    try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch {}

    /* ── Redirect ── */
    location.href = issues[chosenIdx].url;

  } catch (e) {
    document.body.textContent = e.message;
  }
})();
</script>
</body>
</html>
