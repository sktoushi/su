  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --bg:#0f0f12;
      --card:#15151c;
      --muted:#a8a8b3;
      --en:#b9c2ff;
      --la:#e9e9ef;
      --rule:#2a2a35;
      --accent:#7ee0c7;
    }
    body{ background:var(--bg); color:var(--la); }
    .container{ max-width: 860px; }
    .topbar{
      position: sticky; top: 0; z-index: 1030;
      backdrop-filter: blur(10px);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--rule);
    }
    .brand-dot{
      width:10px; height:10px; border-radius:50%;
      display:inline-block; background:var(--accent); margin-right:.5rem;
    }
    .section-title{
      border-bottom: 1px solid var(--rule);
      padding-bottom: .5rem;
      margin-top: 2.25rem;
      margin-bottom: 1rem;
    }
    .card{
      background: var(--card);
      border: 1px solid var(--rule);
    }
    .line{
      padding: .8rem .9rem;
      border-bottom: 1px solid var(--rule);
    }
    .line:last-child{ border-bottom: 0; }
    .en{
      color: var(--en);
      font-size: .96rem;
      line-height: 1.35;
    }
    .la{
      color: var(--la);
      font-size: 1.02rem;
      line-height: 1.35;
      font-weight: 550;
    }
    .vnum{
      color: var(--muted);
      font-size: .82rem;
      margin-right: .5rem;
    }
    .pill{
      border:1px solid var(--rule);
      background: transparent;
      color: var(--la);
    }
    .pill.active{
      border-color: color-mix(in srgb, var(--accent) 50%, var(--rule));
      box-shadow: 0 0 0 .15rem color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .small-note{
      color: var(--muted);
      font-size: .9rem;
    }
    .searchbox input{
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--la);
    }
    .searchbox input::placeholder{ color: color-mix(in srgb, var(--muted) 80%, transparent); }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      border:1px solid var(--rule);
      padding:.1rem .35rem;
      border-radius:.35rem;
      color: var(--muted);
      font-size:.85rem;
    }
    .footer{
      color: var(--muted);
      border-top:1px solid var(--rule);
      margin-top:2.5rem;
      padding-top:1.25rem;
      padding-bottom:1.25rem;
    }
  </style>
</head>

    // Render
    const content = document.getElementById("content");
    let mode = "both"; // both | en | la
    let query = "";

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, (c)=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    function matchesLine(line, q){
      if(!q) return true;
      const hay = (line.en + " " + line.la).toLowerCase();
      return hay.includes(q.toLowerCase());
    }

    function render(){
      content.innerHTML = "";

      sections.forEach(sec=>{
        // Filter lines by search query
        const filtered = sec.lines.filter(l => matchesLine(l, query));
        if(filtered.length === 0) return;

        const header = document.createElement("h3");
        header.className = "section-title";
        header.textContent = sec.title;
        content.appendChild(header);

        const card = document.createElement("div");
        card.className = "card mb-3";

        filtered.forEach(line=>{
          const row = document.createElement("div");
          row.className = "line";

          const vnum = line.v ? `<span class="vnum">${escapeHtml(line.v)}.</span>` : "";

          const enHtml = (mode === "la") ? "" : `
            <div class="en">${vnum}${escapeHtml(line.en)}</div>
          `;
          const laHtml = (mode === "en") ? "" : `
            <div class="la mt-1">${vnum}${escapeHtml(line.la)}</div>
          `;

          row.innerHTML = enHtml + laHtml;
          card.appendChild(row);
        });

        content.appendChild(card);
      });
    }

    // Mode buttons
    const bBoth = document.getElementById("modeBoth");
    const bEn = document.getElementById("modeEn");
    const bLa = document.getElementById("modeLa");

    function setMode(m){
      mode = m;
      [bBoth, bEn, bLa].forEach(b=>b.classList.remove("active"));
      if(m==="both") bBoth.classList.add("active");
      if(m==="en") bEn.classList.add("active");
      if(m==="la") bLa.classList.add("active");
      render();
    }

    bBoth.addEventListener("click", ()=>setMode("both"));
    bEn.addEventListener("click", ()=>setMode("en"));
    bLa.addEventListener("click", ()=>setMode("la"));

    // Search
    const search = document.getElementById("search");
    search.addEventListener("input", (e)=>{
      query = e.target.value.trim();
      render();
    });

    // "/" focuses search like many apps
    window.addEventListener("keydown", (e)=>{
      if(e.key === "/" && document.activeElement !== search){
        e.preventDefault();
        search.focus();
      }
      if(e.key === "Escape" && document.activeElement === search){
        search.value = "";
        query = "";
        search.blur();
        render();
      }
    });

    render();
  </script>
