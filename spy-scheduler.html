<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
(() => {
  const DEFAULT_MAX = 3;

  const params = new URLSearchParams(location.search);
  const max = Math.max(
    DEFAULT_MAX,
    Number(params.get("max")) || 0
  );

  const version = Math.floor(Math.random() * max) + 1;

  location.replace(
    `https://sktoushi.github.io/su/spy-scheduler${version}.html`
  );
})();
</script>
</head>
<body>
Redirecting...
</body>
</html>
