<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Issue Randomizer Hub</title>
  <script src="common/skyway-scheduler-utils.js"></script>
  <script src="common/config-loader.js"></script>

  <script>
    const urls = [
      "https://ryspare25.github.io/ref2510/viewer-pdfjs-4chan2.html?fileName=pmi-acp-first-try.pdf", 
      "https://sktoushi.github.io/su/bucket.html?target=bucket-pmbok-2025-scheduling", 
      "https://sktoushi.github.io/su/vsc5p1-canonical.html", 
      "https://sktoushi.github.io/su/vsc5.html", 
      "https://sktoushi.github.io/su/bucket.html?target=bucket-pmbok-2025", 
      "https://sktoushi.github.io/su/project-management-randomizer-stash2to5.html"
    ];

    function pickRandomUrl() {
      const index = Math.floor(Math.random() * urls.length);
      return urls[index];
    }

    window.onload = () => {
      const targetUrl = pickRandomUrl();
      window.location.replace(targetUrl);
    };
  </script>
</head>

<body>
  <p>Choosing a random repository…</p>
</body>
</html>
