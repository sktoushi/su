<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>all.json Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b0c10;
  --fg:#cfd8dc;
  --muted:#90a4ae;
  --accent:#7cb342;
  --btn:#263238;
  --btn-hover:#37474f;
  --btn-active:#455a64;
  --danger:#e53935;
  --border:#1b2328;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  min-height:100svh;
}

main{
  margin:2rem auto;
  width:min(100%,980px);
}

.paper{
  background:#11161a;
  color:var(--fg);
  border-radius:18px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.05) inset;
  padding:1.5rem;
}

.toolbar{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.btn{
  border:1px solid #111;
  background:var(--btn);
  color:var(--fg);
  padding:.6rem 1rem;
  border-radius:.5rem;
  font-size:1rem;
  cursor:pointer;
  text-decoration:none;
}

.btn:hover{
  background:var(--btn-hover);
}

.btn:active{
  background:var(--btn-active);
}

.btn-accent{
  background:var(--accent);
  color:#000;
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

.btn-small{
  padding:.45rem .7rem;
  font-size:.95rem;
}

.small{
  color:var(--muted);
}

.pill{
  font-size:.85rem;
  padding:.2rem .5rem;
  border-radius:.9rem;
  background:#1c313a;
  color:#b2dfdb;
}

input, textarea{
  width:100%;
  box-sizing:border-box;
  background:#0f1519;
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:8px;
  padding:.65rem;
}

textarea{
  min-height:250px;
  resize:vertical;
}

.card{
  background:#0f1519;
  border:1px solid var(--border);
  border-radius:12px;
  padding:1rem;
  margin-bottom:1rem;
}

.row{
  display:flex;
  gap:.5rem;
  align-items:center;
}

.row input{
  flex:1;
}

.section-title{
  margin-top:2rem;
  margin-bottom:1rem;
  font-size:1.15rem;
  font-weight:700;
}

.repo-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1rem;
}

label{
  display:block;
  margin-bottom:.25rem;
  color:var(--muted);
}

.field{
  margin-bottom:.75rem;
}

#countdown{
  margin-top:1rem;
  font-weight:bold;
  color:#9ccc65;
}
</style>
</head>
<body>

<main>
<section class="paper">

<header style="display:flex;justify-content:space-between;align-items:center;gap:.75rem;">
<div>
<h1>all.json Editor</h1>
<p class="small">
Paste JSON → Load → Edit → Save (copies to clipboard) → Redirect
</p>
</div>

<div class="toolbar">
<button class="btn btn-accent" id="loadBtn">
Load JSON
</button>

<button class="btn btn-accent" id="saveBtn">
Save & Redirect
</button>
</div>
</header>

<div style="margin-top:1rem;">
<label>Redirect URL</label>
<input
id="redirectUrl"
value="https://github.com/sktoushi/su/edit/in/config/all.json">
</div>

<div style="margin-top:1rem;">
<label>Raw JSON</label>
<textarea id="jsonInput">
{
  "repositories": {},
  "formulas": []
}
</textarea>
</div>

<div class="section-title">
Repositories
</div>

<button class="btn btn-small" id="addRepoBtn">
➕ Add Repository
</button>

<div id="repositories"></div>

<div class="section-title">
Formulas
</div>

<button class="btn btn-small" id="addFormulaBtn">
➕ Add Formula
</button>

<div id="formulas"></div>

<div id="countdown"></div>

</section>
</main>

<script>

let data = {
  repositories:{},
  formulas:[]
};

const repositoriesEl =
document.getElementById("repositories");

const formulasEl =
document.getElementById("formulas");

function updateRawJson(){

  document.getElementById("jsonInput").value =
    JSON.stringify(data,null,2);
}

function renderRepositories(){

  repositoriesEl.innerHTML = "";

  Object.entries(data.repositories)
  .forEach(([repoName,repo])=>{

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <div class="repo-title">
        <strong>${repoName}</strong>
        <button class="btn btn-danger btn-small delete-repo">
          Delete
        </button>
      </div>

      <div class="field">
        <label>Username</label>
        <input
          class="username"
          value="${repo.username || ""}">
      </div>

      <div class="field">
        <label>Issue Start Number</label>
        <div class="row">
          <input
            type="number"
            class="issueStart"
            value="${repo.issueStartNumber}">
          <button class="btn btn-small plusStart">
            +10
          </button>
        </div>
      </div>

      <div class="field">
        <label>Issue End Number</label>
        <div class="row">
          <input
            type="number"
            class="issueEnd"
            value="${repo.issueEndNumber}">
          <button class="btn btn-small plusEnd">
            +10
          </button>
        </div>
      </div>
    `;

    card.querySelector(".delete-repo")
    .onclick = ()=>{

      delete data.repositories[repoName];

      renderRepositories();
      updateRawJson();
    };

    const username =
      card.querySelector(".username");

    username.oninput = ()=>{

      repo.username =
        username.value;

      updateRawJson();
    };

    const issueStart =
      card.querySelector(".issueStart");

    issueStart.oninput = ()=>{

      repo.issueStartNumber =
        Number(issueStart.value);

      updateRawJson();
    };

    const issueEnd =
      card.querySelector(".issueEnd");

    issueEnd.oninput = ()=>{

      repo.issueEndNumber =
        Number(issueEnd.value);

      updateRawJson();
    };

    card.querySelector(".plusStart")
    .onclick = ()=>{

      repo.issueStartNumber += 10;

      issueStart.value =
        repo.issueStartNumber;

      updateRawJson();
    };

    card.querySelector(".plusEnd")
    .onclick = ()=>{

      repo.issueEndNumber += 10;

      issueEnd.value =
        repo.issueEndNumber;

      updateRawJson();
    };

    repositoriesEl.appendChild(card);

  });

}

function renderFormulas(){

  formulasEl.innerHTML = "";

  data.formulas.forEach((formula,index)=>{

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <div class="row">
        <input
          class="formulaInput"
          value="${formula}">
        <button
          class="btn btn-danger btn-small deleteFormula">
          Delete
        </button>
      </div>
    `;

    const formulaInput =
      card.querySelector(".formulaInput");

    formulaInput.oninput = ()=>{

      data.formulas[index] =
        formulaInput.value;

      updateRawJson();
    };

    card.querySelector(".deleteFormula")
    .onclick = ()=>{

      data.formulas.splice(index,1);

      renderFormulas();
      updateRawJson();
    };

    formulasEl.appendChild(card);

  });

}

document.getElementById("loadBtn")
.onclick = ()=>{

  try{

    data =
      JSON.parse(
        document.getElementById("jsonInput").value
      );

    if(!data.repositories)
      data.repositories = {};

    if(!data.formulas)
      data.formulas = [];

    renderRepositories();
    renderFormulas();
    updateRawJson();

  }catch(e){

    alert("Invalid JSON");
  }
};

document.getElementById("addRepoBtn")
.onclick = ()=>{

  const repoName =
    prompt("Repository name:");

  if(!repoName)
    return;

  if(data.repositories[repoName]){

    alert("Repository already exists");
    return;
  }

  data.repositories[repoName] = {
    username:"",
    issueStartNumber:1,
    issueEndNumber:1
  };

  renderRepositories();
  updateRawJson();
};

document.getElementById("addFormulaBtn")
.onclick = ()=>{

  data.formulas.push("");

  renderFormulas();
  updateRawJson();
};

document.getElementById("saveBtn")
.onclick = async ()=>{

  const json =
    JSON.stringify(data,null,2);

  await navigator.clipboard.writeText(json);

  let seconds = 3;

  const countdown =
    document.getElementById("countdown");

  countdown.textContent =
    `Copied to clipboard. Redirecting in ${seconds}...`;

  const timer =
    setInterval(()=>{

      seconds--;

      if(seconds <= 0){

        clearInterval(timer);

        location.href =
          document.getElementById("redirectUrl").value;

        return;
      }

      countdown.textContent =
        `Copied to clipboard. Redirecting in ${seconds}...`;

    },1000);
};

</script>

</body>
</html>
