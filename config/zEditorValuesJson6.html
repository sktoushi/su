<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>values.json Editor</title>

<style>
:root{
  --bg:#0b0c10;
  --fg:#cfd8dc;
  --muted:#90a4ae;
  --accent:#7cb342;
  --btn:#263238;
  --border:#1b2328;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui}
main{max-width:1000px;margin:auto;padding:20px}
.paper{background:#11161a;border-radius:18px;padding:20px}
textarea,input{width:100%;box-sizing:border-box;background:#0f1519;color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:10px}
textarea{min-height:320px}
.row{display:flex;gap:8px;align-items:center}
button{background:var(--btn);color:white;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.save{background:var(--accent);color:black}
.card{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}
#countdown{margin-top:12px}
</style>
</head>
<body>
<main>
<div class="paper">
<h1>values.json Editor</h1>

<button onclick="loadJson()">Load JSON</button>
<button onclick="syncJsonToFields()">JSON → Fields</button>
<button onclick="syncFieldsToJson()">Fields → JSON</button>
<button class="save" onclick="saveAndRedirect()">Save & Redirect</button>

<h3>Amplification Controls (First 3 items under base)</h3>
<div id="controls"></div>

<h3>Raw JSON</h3>
<textarea id="jsonInput"></textarea>

<div id="countdown"></div>
</div>
</main>

<script>
const STORAGE_KEY="valuesJsonEditor";
const REDIRECT_URL="https://github.com/sktoushi/su/edit/in/config/values.json";
let data=null;

function persist(){
 localStorage.setItem(STORAGE_KEY,document.getElementById("jsonInput").value);
}

function loadJson(){
 try{
  data=JSON.parse(document.getElementById("jsonInput").value);
  renderControls();
  persist();
 }catch(e){alert("Invalid JSON");}
}

function renderControls(){
 const wrap=document.getElementById("controls");
 wrap.innerHTML="";
 if(!data||!data.base)return;

 const firstThree=Object.entries(data.base).slice(0,3);

 firstThree.forEach(([key,val],idx)=>{
  const card=document.createElement("div");
  card.className="card";

  let extraButton="";
  if(idx===0){
   extraButton='<button onclick="copyElement3(0)">Copy Element 3</button>';
  }
  if(idx===1){
   extraButton='<button onclick="copyElement3(1)">Copy Element 3</button>';
  }

  card.innerHTML=`
   <strong>${key}</strong>
   <div class="row">
    <input id="v${idx}" value="${val}" oninput="fieldChanged(${idx},this.value)">
    <button onclick="adjust(${idx},0.9)">-10%</button>
    <button onclick="adjust(${idx},1.1)">+10%</button>
    ${extraButton}
   </div>`;

  wrap.appendChild(card);
 });
}

function fieldChanged(index,value){
 if(!data||!data.base)return;
 const entries=Object.entries(data.base);
 if(!entries[index])return;
 data.base[entries[index][0]]=value;
}

function copyElement3(targetIndex){
 const source=document.getElementById("v2");
 const target=document.getElementById(`v${targetIndex}`);
 if(!source||!target)return;
 target.value=source.value;
 fieldChanged(targetIndex,source.value);
}

function syncJsonToFields(){
 try{
  data=JSON.parse(document.getElementById("jsonInput").value);
  Object.entries(data.base).slice(0,3).forEach(([k,v],idx)=>{
   const el=document.getElementById(`v${idx}`);
   if(el)el.value=v;
  });
  persist();
 }catch(e){alert("Invalid JSON");}
}

function syncFieldsToJson(){
 try{
  if(!data){
   data=JSON.parse(document.getElementById("jsonInput").value);
  }
  Object.entries(data.base).slice(0,3).forEach(([k],idx)=>{
   const el=document.getElementById(`v${idx}`);
   if(el)data.base[k]=el.value;
  });
  document.getElementById("jsonInput").value=JSON.stringify(data,null,2);
  persist();
 }catch(e){alert("Unable to sync fields");}
}

function adjust(index,mult){
 const entries=Object.entries(data.base);
 const key=entries[index][0];
 const current=parseFloat(data.base[key]);
 if(isNaN(current))return;

 data.base[key]=String(Math.round(current*mult));
 document.getElementById("jsonInput").value=JSON.stringify(data,null,2);
 persist();
 renderControls();
}

document.getElementById("jsonInput").addEventListener("input",persist);

async function saveAndRedirect(){
 try{data=JSON.parse(document.getElementById("jsonInput").value);}catch(e){}
 const json=document.getElementById("jsonInput").value;
 localStorage.setItem(STORAGE_KEY,json);
 await navigator.clipboard.writeText(json);

 let s=3;
 const el=document.getElementById("countdown");
 el.textContent="Copied. Redirecting in "+s;

 const timer=setInterval(()=>{
  s--;
  if(s<=0){
   clearInterval(timer);
   location.href=REDIRECT_URL;
   return;
  }
  el.textContent="Copied. Redirecting in "+s;
 },1000);
}

const saved=localStorage.getItem(STORAGE_KEY);
if(saved){
 document.getElementById("jsonInput").value=saved;
 try{
  data=JSON.parse(saved);
  renderControls();
 }catch(e){}
}
</script>
</body>
</html>
