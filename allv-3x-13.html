<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spaced Repetition Picker (v13)</title>
  <script src="common/random-utils.js"></script>
  <script src="common/config-loader.js"></script>
  <script src="common/stash-excess-detector.js"></script>
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0c10;
      color: #c5c6c7;
      margin: 2rem;
    }
  </style>
</head>
<body>

<script>
/**
 * allv13.html - SPACED REPETITION OPTIMIZER
 * 
 * Cognitive Strategy: Implements SM-2 inspired spaced repetition
 * - Prioritizes items due for review based on forgetting curve
 * - Balances new content exposure with review cycles
 * - Adapts intervals based on implicit success (time since last view)
 * - Optimal for long-term retention and mastery
 */
(async () => {
  // Check for stash excess on page load
  StashExcessDetector.checkAndAlert().catch(e => console.error('Stash check failed:', e));

  try {
    const cfg = await ConfigLoader.load('all');
    const repos = cfg.repositories3x || {};

    // Build repository entries
    const entries = [];
    for (const [repoName, info] of Object.entries(repos)) {
      const start = Number(info.issueStartNumber);
      const end = Number(info.issueEndNumber);
      const issueCount = Math.max(0, end - start + 1);
      const match = repoName.match(/x(\d+)$/i);
      const multiplier = match ? Math.max(1, Number(match[1])) : 1;

      entries.push({
        repoName,
        username: info.username,
        start,
        end,
        issueCount,
        multiplier
      });
    }

    const n = entries.length;
    const weights = new Array(n).fill(0);

    // Spaced Repetition Storage
    const SR_KEY = 'spacedRepetition_v13';
    let srData = JSON.parse(localStorage.getItem(SR_KEY) || '{}');
    const now = Date.now();
    const MS_PER_DAY = 86400000;

    // Initialize or update spaced repetition data
    for (let i = 0; i < n; i++) {
      const repo = entries[i];
      const key = `${repo.username}/${repo.repoName}`;
      
      if (!srData[key]) {
        srData[key] = {
          lastSeen: 0,
          reviewCount: 0,
          intervalDays: 1,
          easeFactor: 2.5,
          nextReview: now
        };
      }

      const item = srData[key];
      const daysSinceLastSeen = (now - item.lastSeen) / MS_PER_DAY;
      const daysUntilDue = (item.nextReview - now) / MS_PER_DAY;

      // Calculate weight based on spaced repetition principles
      let weight = repo.issueCount * repo.multiplier;

      // Urgency factor: items overdue get higher priority
      if (daysUntilDue <= 0) {
        const overdueBoost = Math.min(5, Math.abs(daysUntilDue) + 1);
        weight *= (1 + overdueBoost);
      } else {
        // Not yet due: reduce weight proportionally
        const duenessFactor = Math.max(0.1, 1 - (daysUntilDue / item.intervalDays));
        weight *= duenessFactor;
      }

      // Novelty bonus for never-seen items
      if (item.reviewCount === 0) {
        weight *= 1.8;
      }

      // Forgetting curve: items with longer intervals need more frequent checks
      const forgettingFactor = 1 + (item.intervalDays / 30);
      weight *= Math.sqrt(forgettingFactor);

      // Apply probability booster
      const booster = Number(repos[repo.repoName]?.probabilityBooster) || 1;
      weight *= booster;

      weights[i] = Math.max(0.0001, weight);
    }

    // Apply noise for natural variation
    function applyNoise(weights) {
      const cryptoRandom = () => {
        const buf = new Uint32Array(1);
        crypto.getRandomValues(buf);
        return buf[0] / 0xffffffff;
      };

      const cryptoNormal = (mean = 0, stdDev = 1) => {
        let u1 = 0, u2 = 0;
        while (u1 === 0) u1 = cryptoRandom();
        while (u2 === 0) u2 = cryptoRandom();
        const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
        return z0 * stdDev + mean;
      };

      const stdDev = 0.12; // Moderate variation
      return weights.map(w => {
        const noise = cryptoNormal(0, stdDev) * w;
        return Math.max(0.0001, w + noise);
      });
    }

    const adjusted = applyNoise(weights);
    const sum = adjusted.reduce((a, b) => a + b, 0);
    const normalized = adjusted.map(w => w / sum);

    // Select repository
    const r = crypto.getRandomValues(new Uint32Array(1))[0] / 0xffffffff;
    let cumulative = 0;
    let chosenIdx = normalized.length - 1;
    for (let i = 0; i < normalized.length; i++) {
      cumulative += normalized[i];
      if (r < cumulative) {
        chosenIdx = i;
        break;
      }
    }

    const repo = entries[chosenIdx];
    const key = `${repo.username}/${repo.repoName}`;
    const item = srData[key];

    // Update spaced repetition data
    item.lastSeen = now;
    item.reviewCount += 1;

    // SM-2 algorithm: adjust interval and ease factor
    // Assume implicit quality of 4 (good) for passive review
    const quality = 4;
    if (item.reviewCount === 1) {
      item.intervalDays = 1;
    } else if (item.reviewCount === 2) {
      item.intervalDays = 6;
    } else {
      item.intervalDays = Math.round(item.intervalDays * item.easeFactor);
    }

    // Update ease factor
    item.easeFactor = item.easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
    item.easeFactor = Math.max(1.3, Math.min(2.5, item.easeFactor));

    // Set next review date
    item.nextReview = now + (item.intervalDays * MS_PER_DAY);

    // Save updated data
    localStorage.setItem(SR_KEY, JSON.stringify(srData));

    // Select random issue from chosen repository
    const issueNumber = repo.start + Math.floor(
      (crypto.getRandomValues(new Uint32Array(1))[0] / 0xffffffff) *
      (repo.end - repo.start + 1)
    );

    const chosenUrl = `https://github.com/${repo.username}/${repo.repoName}/issues/${issueNumber}`;
    location.href = chosenUrl;

    document.addEventListener('DOMContentLoaded', () => {
      const pre = document.createElement('pre');
      pre.textContent =
        `Strategy: Spaced Repetition (v13)\n` +
        `Repository: ${repo.repoName}\n` +
        `Issue: ${issueNumber}\n` +
        `Review Count: ${item.reviewCount}\n` +
        `Interval: ${item.intervalDays.toFixed(1)} days\n` +
        `Ease Factor: ${item.easeFactor.toFixed(2)}\n` +
        `URL: ${chosenUrl}`;
      document.body.appendChild(pre);
    });

  } catch (e) {
    document.body.textContent = e.message;
  }
})();
</script>

</body>
</html>
