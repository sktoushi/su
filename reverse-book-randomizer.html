<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oscillating PDF Randomizer</title>

  <script>
    /***********************
     * Utilities
     ***********************/
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    /***********************
     * Params
     ***********************/
    const username = getParam("username"); // namespacing only
    const repo = getParam("repo");         // namespacing only
    const max = parseInt(getParam("max"), 10);

    if (!Number.isInteger(max) || max <= 0) {
      document.body.innerText =
        "Invalid parameters. Required: max (positive integer).";
      throw new Error("Invalid parameters");
    }

    /***********************
     * IndexedDB setup
     ***********************/
    const paramSignature = JSON.stringify({
      username,
      repo,
      max
    });

    const dbHash = hashString(paramSignature);
    const DB_NAME = `OscillatingPDF_${dbHash}`;
    const DB_VERSION = 1;
    const STORE_NAME = "state";

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);

        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "key" });
          }
        };

        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function getLastValue(db) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.get("last");

        req.onsuccess = () => {
          resolve(req.result ? req.result.value : null);
        };
        req.onerror = () => resolve(null);
      });
    }

    function setLastValue(db, value) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put({ key: "last", value });
        tx.oncomplete = () => resolve();
      });
    }

    /***********************
     * Oscillating logic
     ***********************/
    function pickNext(n) {
      const r = Math.random();

      // 55% move backward
      if (r < 0.55) return n - 1;

      // 22.5% stay
      if (r < 0.775) return n;

      // 22.5% move forward
      return n + 1;
    }

    /***********************
     * Main
     ***********************/
    (async function run() {
      const db = await openDB();
      let last = await getLastValue(db);

      // First run: start at max
      if (!Number.isInteger(last)) {
        last = max;
      }

      let next = pickNext(last);

      // Bounds enforcement
      if (next < 1) next = max;
      if (next > max) next = max;

      await setLastValue(db, next);

      const target =
        `https://ryspare25.github.io/ref2510/viewer-pdfjs-4chan2.html?fileName=${next}.pdf`;

      window.location.replace(target);
    })();
  </script>
</head>

<body>
  Oscillating intelligently through PDFs…
</body>
</html>
