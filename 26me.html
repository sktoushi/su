<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Are you free? Or are you a mouse governed by something else?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    :root{
      --bg:#0b0c10; --fg:#cfd8dc; --muted:#90a4ae; --accent:#7cb342;
      --btn:#263238; --btn-hover:#37474f; --btn-active:#455a64;
      --border:#1b2328;
    }
    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      min-height:100svh;
      display:flex; align-items:center; justify-content:center;
    }

    main { width:min(100%, 600px); }

    .paper{
      background:#11161a;
      border-radius:18px;
      box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05) inset;
      padding:2rem;
      text-align:center;
    }

    .btn{
      border:1px solid #111; background:var(--btn); color:var(--fg);
      padding:.9rem 1.6rem; border-radius:.5rem; font-size:1.1rem; cursor:pointer;
      transition: transform .05s ease, background .15s ease;
      box-shadow:0 2px 0 rgba(0,0,0,.3);
      margin:.6rem;
      display:inline-block;
    }
    .btn:hover{background:var(--btn-hover);}
    .btn:active{transform:translateY(1px); background:var(--btn-active);}
    .btn-accent{background:var(--accent); color:#0b0c10; border-color:#5a8e2f;}
  </style>
</head>
<body>
  <main id="app"></main>

  <script>
    const app = document.getElementById("app");

    const usePaper = Math.random() < 0.5;

    const container = document.createElement("div");
    if (usePaper) container.className = "paper";

    container.innerHTML = `
      <h1 style="margin-bottom:1.5rem;">Are you free? Or are you a mouse governed by something else?</h1>
      <div>
        <button class="btn btn-accent" onclick="go('underground')">Underground</button>
        <button class="btn btn-accent" onclick="go('finisher')">Finisher</button>
        <button class="btn btn-accent" onclick="go('twoplustwo')">TwoPlusTwoMan</button>
      </div>
    `;

    app.appendChild(container);

    function go(type){
      const randomRedirect = Math.random() < 0.5;

      if(randomRedirect){
        window.location.href = "https://sktoushi.github.io/su/lc300.html?target=indexedDb-solomon-verses.csv";
        return;
      }

      if(type === "underground"){
        const undergroundAlt = Math.random() < 0.33;

        if(undergroundAlt){
          // window.location.href = "https://sktoushi.github.io/su/notes-from-underground-dostoevsky.html";
          window.location.href = "https://ryspare25.github.io/ref2603/underground-series1.html";
        } else {
          window.location.href = "https://github.com/sktoushi/26underground/issues/new";
        }
      }

      if(type === "finisher"){
        window.location.href = "https://github.com/sktoushi/26fin/issues/new";
      }

      if(type === "twoplustwo"){
        window.location.href = "https://github.com/sktoushi/26twoplustwoisfour/issues/new";
      }
    }
  </script>
</body>
</html>
