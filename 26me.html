<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>#######</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    :root{
      --bg:#0b0c10; --fg:#cfd8dc; --muted:#90a4ae; --accent:#7cb342;
      --btn:#263238; --btn-hover:#37474f; --btn-active:#455a64; --danger:#e53935;
      --border:#1b2328;
    }
    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      min-height:100svh;
      display:flex; align-items:center; justify-content:center;
    }
    main { margin: 2rem auto; width:min(100%, 480px); text-align:center; }

    .btn{
      border:1px solid #111; background:var(--btn); color:var(--fg);
      padding:.8rem 1.5rem; border-radius:.5rem; font-size:1.2rem; cursor:pointer;
      transition: transform .05s ease, background .15s ease, box-shadow .15s ease;
      box-shadow:0 2px 0 rgba(0,0,0,.3); user-select:none; text-decoration:none;
      margin: .75rem;
      display:inline-block;
    }
    .btn:hover{background:var(--btn-hover);}
    .btn:active{transform:translateY(1px); background:var(--btn-active);}
    .btn-accent{background:var(--accent); color:#0b0c10; border-color:#5a8e2f;}
    .btn-outline{background:transparent; border-color:var(--border); color:var(--fg);}
    .btn:focus-visible { outline: 2px solid #9ccc65; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 style="margin-bottom:1.5rem;">Project Links</h1>
    <div>
      <a href="https://github.com/sktoushi/26underground/issues/new" class="btn btn-accent">Underground</a>
      <a href="https://github.com/sktoushi/26fin/issues/new" class="btn btn-accent">Finisher</a>
      <a href="https://github.com/sktoushi/26twoplustwoisfour" class="btn btn-accent">TwoPlusTwoMan</a>
    </div>
  </main>
</body>
</html>
