<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduler Redirect</title>
</head>
<body>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);

  // Parse scheduler names
  const names = (params.get("skedNames") || "")
    .split("_")
    .filter(Boolean);

  // Parse max values
  const maxValues = (params.get("maxWeights") || "")
    .split("_")
    .map(n => parseInt(n, 10));

  // Parse allocation weights (optional)
  let allocations = (params.get("allocation") || "")
    .split("_")
    .map(n => parseInt(n, 10));

  // Default to equal weights if allocation missing/invalid
  if (
    allocations.length !== names.length ||
    allocations.some(n => !Number.isInteger(n) || n <= 0)
  ) {
    allocations = new Array(names.length).fill(1);
  }

  // Build scheduler list
  const schedulers = [];

  for (let i = 0; i < names.length; i++) {
    const max = maxValues[i];

    if (Number.isInteger(max) && max > 0) {
      schedulers.push({
        name: names[i],
        max: max,
        weight: allocations[i]
      });
    }
  }

  if (schedulers.length === 0) {
    document.body.textContent =
      "Error: No valid schedulers were supplied.";
    return;
  }

  // Weighted random selection
  const totalWeight = schedulers.reduce(
    (sum, s) => sum + s.weight,
    0
  );

  let r = Math.random() * totalWeight;
  let chosenScheduler = schedulers[0];

  for (const s of schedulers) {
    if (r < s.weight) {
      chosenScheduler = s;
      break;
    }
    r -= s.weight;
  }

  // Random number from 1..max
  const chosenNumber =
    Math.floor(Math.random() * chosenScheduler.max) + 1;

  // Redirect
  window.location.replace(
    `https://sktoushi.github.io/su/${chosenScheduler.name}-scheduler.html?max=${chosenNumber}`
  );
})();
</script>

</body>
</html>
