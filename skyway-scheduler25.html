<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Horror Randomizer</title>
  <script src="common/failover-cache.js"></script>
  <script src="common/skyway-scheduler-utils.js"></script>
  <script src="common/config-loader.js"></script>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<script>
const urls = [
"https://sktoushi.github.io/su/all503020.html",
"https://www.lesswrong.com/allPosts",
"https://stackoverflow.blog/newsletter/"
];

function secureRandomIndex(max) {
    const array = new Uint32Array(1);
    crypto.getRandomValues(array);
    return array[0] % max;
}

function generateTargetURL() {
    return urls[secureRandomIndex(urls.length)];
}

FailoverCache.redirect('skyway-scheduler25', generateTargetURL, {
    cacheSize: 2,
    maxTotalCached: 30,
    resetThreshold: 50
});
</script>
</head>

<body>
<p>Redirecting...</p>
</body>
</html>
