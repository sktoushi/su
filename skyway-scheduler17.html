<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Redirect</title>
  <script src="common/failover-cache.js"></script>
  <script src="common/skyway-scheduler-utils.js"></script>
  <script src="common/config-loader.js"></script>
    <script>
        // Array of destinations
        const links = [
            "https://sktoushi.github.io/su/lc300.html?target=skyway-redirect0915-63-bucket-worldly-wisdom.csv",  
            "https://sktoushi.github.io/su/log426.html" 
        ];

        // ===== FAILOVER CACHE INTEGRATION =====
        function generateTargetURL() {
          return links[Math.floor(Math.random() * links.length)];
        }

        FailoverCache.redirect('skyway-scheduler17', generateTargetURL, {
          cacheSize: 2,
          maxTotalCached: 30,
          resetThreshold: 50,
          redirect: function(target) { window.location.href = target; }
        });
    </script>
</head>
<body>
    <noscript>
        JavaScript is required for this page to redirect.
    </noscript>
</body>
</html>
